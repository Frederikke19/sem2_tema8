<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product</title>
</head>

<body>
    <header class="site-header">
        <img src="img/img_FashionRus.png" alt="Logo" class="logo">
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productlist.html">Products</a></li>
                <li><a href="product.html">Product</a></li>
            </ul>
        </nav>

    </header>

    <main class="product-page">


        <img src="img/img_blouse.png" alt="blouse" class="product-photo">


        <section class="product-details">
            <h2>Product Information</h2>
            <dl>
                <dt>Model name</dt>
                <dd>black blouse</dd>
                <dt>Color</dt>
                <dd>Blue</dd>
                <dt>Inventory number</dt>
                <dd>1163</dd>
            </dl>

            <h2>Pull & Bear</h2>
            <p>Pull & Bear, creating experiences for today's clubber</p>
        </section>


        <section class="basket">
            <p class="basket-info">P&B Blouse</p>
            <h1>black blouse with cuty</h1>
            <p class="basket-price">DKK 895,-</p>

            <form>
                <label for="size">Choose a size</label>
                <select id="size" name="size">
                    <option>S</option>
                    <option>M</option>
                    <option>L</option>
                    <option>XL</option>
                </select>
                <button type="submit">Add to basket</button>
            </form>
        </section>

    </main>

</body>


</html>
