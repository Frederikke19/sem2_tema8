<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>


<body>

    <header class="site-header">
        <img src="img/img_FashionRus.png" alt="Logo" class="logo">
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productlist.html">Products</a></li>
                <li><a href="product.html">Product</a></li>
            </ul>
        </nav>
    </header>

    <main class="products">
        <h1>Products</h1>


        <div class="product-grid">


            <a href="product.html" class="product-card">
                <div class="product-image">
                    <img src="img/img_blouse.png" alt="Sahara Team India Fanwear Round Neck Jersey">
                </div>
                <h2>Sahara Team India Fanwear Round Neck Jersey</h2>
                <p class="product-info">Tshirts | Nike</p>
                <p class="price">DKK 895,-</p>
            </a>


            <a href="product.html" class="product-card discount">
                <div class="product-image">
                    <img src="img/img_boots.png" alt="boots">
                    <span class="badge">-30%</span>
                </div>
                <h2>Black Blouse</h2>
                <p class="product-info">Shirts</p>
                <p class="price">
                    <del>DKK 1.299,-</del>
                    <span class="new-price">DKK 909,-</span>
                </p>
            </a>


            <a href="product.html" class="product-card soldout">
                <div class="product-image">
                    <img src="img/img_blouse.png" alt="Women Blue Denim Jacket">
                    <span class="badge">Sold out</span>
                </div>
                <h2>Women Blue Denim Jacket</h2>
                <p class="product-info">Jackets | Levis</p>
                <p class="price">DKK 699,-</p>
            </a>


            <a href="product.html" class="product-card soldout discount">
                <div class="product-image">
                    <img src="img/img_boots.png" alt="Unisex Leather Wallet">
                    <span class="badge">Sold out</span>
                </div>
                <h2>Unisex Leather Wallet</h2>
                <p class="product-info">Wallets | Fossil</p>
                <p class="price">
                    <del>DKK 499,-</del>
                    <span class="new-price">DKK 349,-</span>
                </p>
            </a>



        </div>
    </main>

</body>

</html>
